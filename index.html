<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Classic 2003</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        #top-bar {
            width: 864px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            padding: 0 4px;
        }

        .level-info {
            color: #ff3333;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level-icon {
            width: 20px;
            height: 20px;
            background: #ff3333;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid #fff;
        }

        .hp-bar-container {
            width: 500px;
            height: 18px;
            background: #111;
            border: 2px solid #555;
            overflow: hidden;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #2563eb, #ec4899, #f97316, #eab308);
            transition: width 0.2s linear;
        }

        .score-info {
            color: #eab308;
            font-weight: bold;
            font-size: 18px;
        }

        #game-container {
            position: relative;
            background: #b0c4de;
            padding: 2px;
            border: 3px solid #4682b4;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(18, 48px);
            grid-template-rows: repeat(11, 52px);
            gap: 0px;
            background-color: #708090;
        }

        .tile {
            width: 48px;
            height: 52px;
            background-color: #dbe0e6;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tile:hover {
            background-color: #ffffff;
        }

        .tile.selected {
            background-color: #fde047 !important;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        .tile.empty, .tile.border {
            visibility: hidden;
            pointer-events: none;
        }

        .pokemon-img {
            width: 38px;
            height: 42px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        canvas#line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="level-info"><span class="level-icon"></span> 1/999</div>
        <div class="hp-bar-container">
            <div id="hp-bar"></div>
        </div>
        <div class="score-info">🎖️ <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        <canvas id="line-canvas"></canvas>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 16;
        const TILE_W = 48;
        const TILE_H = 52;
        const NUM_TYPES = 36;

        // Khai báo chính xác các file âm thanh của bạn
        const sndClick = new Audio('audio/click.mp3');
        const sndConnect = new Audio('audio/connect.mp3');
        const sndStop = new Audio('audio/stop.mp3');
        const sndTheme = new Audio('audio/theme.mp3');
        sndTheme.loop = true; // Bật lặp lại nhạc nền

        let isThemePlaying = false;

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function playThemeMusic() {
            if (!isThemePlaying) {
                sndTheme.play().then(() => {
                    isThemePlaying = true;
                }).catch(() => {});
            }
        }

        let board = [];
        let selectedTile = null;
        let score = 0;
        let timeLeft = 300;
        let timerId = null;

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function initGame() {
            score = 0;
            timeLeft = 300;
            selectedTile = null;
            
            document.getElementById('score').innerText = score;

            clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);

            board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

            let totalTiles = ROWS * COLS;
            let pairs = [];
            for (let i = 0; i < totalTiles / 2; i++) {
                let typeIdx = (i % NUM_TYPES) + 1;
                pairs.push(typeIdx, typeIdx);
            }

            pairs.sort(() => Math.random() - 0.5);

            let idx = 0;
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    board[r][c] = pairs[idx++];
                }
            }

            canvas.width = (COLS + 2) * TILE_W;
            canvas.height = (ROWS + 2) * TILE_H;

            renderBoard();
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS + 2; r++) {
                for (let c = 0; c < COLS + 2; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');

                    if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                        tile.classList.add('border');
                    } else if (board[r][c] === -1) {
                        tile.classList.add('empty');
                    } else {
                        const img = document.createElement('img');
                        img.classList.add('pokemon-img');
                        img.src = `images/pieces${board[r][c]}.png`;
                        tile.appendChild(img);

                        tile.addEventListener('click', () => onTileClick(r, c));
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function onTileClick(r, c) {
            if (board[r][c] === -1) return;

            // Bật nhạc nền ở tương tác đầu tiên của người dùng
            playThemeMusic();

            const currentTile = { r, c };

            if (!selectedTile) {
                playSound(sndClick); // Phát tiếng click chọn ô thứ nhất
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    // Click lại chính ô đó để bỏ chọn
                    getTileEl(r, c).classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                if (board[selectedTile.r][selectedTile.c] === board[r][c]) {
                    const path = findPath(selectedTile, currentTile);
                    if (path) {
                        drawPath(path);
                        playSound(sndConnect); // Phát tiếng connect khi ăn điểm
                        
                        board[selectedTile.r][selectedTile.c] = -1;
                        board[r][c] = -1;
                        
                        score += 10;
                        document.getElementById('score').innerText = score;

                        selectedTile = null;

                        setTimeout(() => {
                            clearPath();
                            renderBoard();
                            checkWin();
                        }, 150);
                        return;
                    }
                }

                // Nếu chọn sai (khác loại hoặc không nối được), phát tiếng stop
                playSound(sndStop);
                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            }
        }

        function getTileEl(r, c) {
            return boardEl.children[r * (COLS + 2) + c];
        }

        function findPath(p1, p2) {
            if (p1.r === p2.r && checkLineX(p1.c, p2.c, p1.r)) return [p1, p2];
            if (p1.c === p2.c && checkLineY(p1.r, p2.r, p1.c)) return [p1, p2];

            if (board[p1.r][p2.c] === -1 && checkLineX(p1.c, p2.c, p1.r) && checkLineY(p1.r, p2.r, p2.c)) {
                return [p1, { r: p1.r, c: p2.c }, p2];
            }
            if (board[p2.r][p1.c] === -1 && checkLineY(p1.r, p2.r, p1.c) && checkLineX(p1.c, p2.c, p2.r)) {
                return [p1, { r: p2.r, c: p1.c }, p2];
            }

            for (let c = 0; c < COLS + 2; c++) {
                if (c === p1.c) continue;
                if (checkLineX(p1.c, c, p1.r) && 
                    board[p1.r][c] === -1 && board[p2.r][c] === -1 &&
                    checkLineY(p1.r, p2.r, c) && 
                    checkLineX(c, p2.c, p2.r)) {
                    return [p1, { r: p1.r, c: c }, { r: p2.r, c: c }, p2];
                }
            }

            for (let r = 0; r < ROWS + 2; r++) {
                if (r === p1.r) continue;
                if (checkLineY(p1.r, r, p1.c) && 
                    board[r][p1.c] === -1 && board[r][p2.c] === -1 &&
                    checkLineX(p1.c, p2.c, r) && 
                    checkLineY(r, p2.r, p2.c)) {
                    return [p1, { r: r, c: p1.c }, { r: r, c: p2.c }, p2];
                }
            }

            return null;
        }

        function checkLineX(c1, c2, r) {
            const min = Math.min(c1, c2);
            const max = Math.max(c1, c2);
            for (let c = min + 1; c < max; c++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function checkLineY(r1, r2, c) {
            const min = Math.min(r1, r2);
            const max = Math.max(r1, r2);
            for (let r = min + 1; r < max; r++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function drawPath(path) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 3;

            for (let i = 0; i < path.length; i++) {
                const x = path[i].c * TILE_W + TILE_W / 2;
                const y = path[i].r * TILE_H + TILE_H / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function clearPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('hp-bar').style.width = (timeLeft / 300 * 100) + '%';
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert('Hết giờ!');
                initGame();
            }
        }

        function checkWin() {
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) return false;
                }
            }
            clearInterval(timerId);
            alert('Thắng cuộc!');
            initGame();
            return true;
        }

        window.onload = initGame;
    </script>
</body>
</html>
