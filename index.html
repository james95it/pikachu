<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikachu Classic 2003</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: #000 url('images/background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            padding: 4px;
        }

        #top-bar {
            width: 100%;
            max-width: 950px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .level-info {
            color: #ff4d4d;
            font-weight: bold;
            font-size: clamp(16px, 3vw, 20px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .level-icon {
            width: 18px;
            height: 18px;
            background: #ff4d4d;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid #fff;
        }

        .hp-bar-container {
            flex: 1;
            max-width: 350px;
            height: 22px;
            background: #111;
            border: 2px solid #666;
            overflow: hidden;
            border-radius: 6px;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #2563eb, #ec4899, #f97316, #eab308);
            transition: width 0.2s linear;
        }

        .score-info {
            color: #facc15;
            font-weight: bold;
            font-size: clamp(16px, 3vw, 20px);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background: linear-gradient(135deg, #374151, #1f2937);
            color: #fff;
            border: 2px solid #6b7280;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.15s ease-in-out;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #4b5563, #374151);
            border-color: #9ca3af;
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #game-container {
            position: relative;
            background: rgba(112, 128, 144, 0.95);
            padding: 0;
            border: 2px solid #4682b4;
            max-width: 100vw;
            overflow: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            transition: opacity 0.3s ease;
        }

        #game-container.paused {
            opacity: 0;
            pointer-events: none;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(18, var(--tile-w, 50px));
            grid-template-rows: repeat(11, var(--tile-h, 56px));
            gap: 0px;
            background-color: #708090;
        }

        .tile {
            width: var(--tile-w, 50px);
            height: var(--tile-h, 56px);
            background-color: #dbe0e6;
            border: 1px solid #a0a0a0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .tile:hover {
            background-color: #ffffff;
        }

        .tile.selected {
            background-color: #fde047 !important;
            border: 2px solid #ff0000;
        }

        .tile.hint-highlight {
            border: 3px solid #ef4444 !important;
            background-color: #fee2e2 !important;
            box-sizing: border-box;
        }

        .tile.empty, .tile.border {
            visibility: hidden;
            pointer-events: none;
        }

        .pokemon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
            display: block;
        }

        canvas#line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        @media (max-width: 950px) {
            :root {
                --tile-w: calc(98vw / 18);
                --tile-h: calc((98vw / 18) * 1.12);
            }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <!-- Đã điều chỉnh hiển thị 1/9 -->
        <div class="level-info"><span class="level-icon"></span> <span id="level-display">1</span>/9</div>
        <div class="hp-bar-container">
            <div id="hp-bar"></div>
        </div>
        <div class="score-info">
            <span>🎖️ <span id="score">0</span></span>
            <button id="hint-btn" class="btn-action" onclick="useHint()">💡 <span id="hint-count">10</span></button>
            <button id="pause-btn" class="btn-action" onclick="togglePause()">⏸️</button>
            <button id="fullscreen-btn" class="btn-action" onclick="toggleFullscreen()">⛶</button>
        </div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        <canvas id="line-canvas"></canvas>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 16;
        const NUM_TYPES = 36;
        const GAME_TIME = 480;

        let tileW = 50;
        let tileH = 56;

        const sndClick = new Audio('audio/click.mp3');
        const sndConnect = new Audio('audio/connect.mp3');
        const sndStop = new Audio('audio/stop.mp3');
        const sndTheme = new Audio('audio/theme.mp3');
        sndTheme.loop = true;

        let isThemePlaying = false;
        let isGameStarted = false; 
        let isPaused = false;
        let hintsLeft = 10;
        let activeHintTiles = [];
        let currentLevel = 1;

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function playThemeMusic() {
            if (!isThemePlaying && !isPaused) {
                sndTheme.play().then(() => {
                    isThemePlaying = true;
                }).catch(() => {});
            }
        }

        function pauseThemeMusic() {
            if (isThemePlaying) {
                sndTheme.pause();
                isThemePlaying = false;
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function togglePause() {
            if (!isGameStarted) return;

            isPaused = !isPaused;
            const container = document.getElementById('game-container');
            const pauseBtn = document.getElementById('pause-btn');

            if (isPaused) {
                clearInterval(timerId);
                pauseThemeMusic();
                container.classList.add('paused');
                pauseBtn.innerText = '▶️';
            } else {
                timerId = setInterval(updateTimer, 1000);
                playThemeMusic();
                container.classList.remove('paused');
                pauseBtn.innerText = '⏸️';
            }
        }

        function clearActiveHints() {
            activeHintTiles.forEach(tileEl => {
                if (tileEl) tileEl.classList.remove('hint-highlight');
            });
            activeHintTiles = [];
        }

        function useHint() {
            if (isPaused || hintsLeft <= 0) return;

            const validPairs = getAllValidPairs();
            if (validPairs.length > 0) {
                clearActiveHints();

                hintsLeft--;
                document.getElementById('hint-count').innerText = hintsLeft;
                if (hintsLeft === 0) {
                    document.getElementById('hint-btn').disabled = true;
                }

                const randomPair = validPairs[Math.floor(Math.random() * validPairs.length)];
                const el1 = getTileEl(randomPair[0].r, randomPair[0].c);
                const el2 = getTileEl(randomPair[1].r, randomPair[1].c);

                el1.classList.add('hint-highlight');
                el2.classList.add('hint-highlight');

                activeHintTiles = [el1, el2];
            }
        }

        let board = [];
        let selectedTile = null;
        let score = 0;
        let timeLeft = GAME_TIME;
        let timerId = null;

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function updateTileDimensions() {
            const firstTile = document.querySelector('.tile');
            if (firstTile) {
                const rect = firstTile.getBoundingClientRect();
                tileW = rect.width;
                tileH = rect.height;
                canvas.width = (COLS + 2) * tileW;
                canvas.height = (ROWS + 2) * tileH;
            }
        }

        function initGame(resetLevel = true) {
            if (resetLevel) {
                currentLevel = 1;
                score = 0;
            }
            
            timeLeft = GAME_TIME;
            selectedTile = null;
            isGameStarted = false;
            isPaused = false;
            hintsLeft = 10;
            clearActiveHints();
            
            document.getElementById('level-display').innerText = currentLevel;
            document.getElementById('hint-count').innerText = hintsLeft;
            document.getElementById('hint-btn').disabled = false;
            document.getElementById('pause-btn').innerText = '⏸️';
            document.getElementById('game-container').classList.remove('paused');

            pauseThemeMusic();

            document.getElementById('score').innerText = score;
            document.getElementById('hp-bar').style.width = '100%';

            clearInterval(timerId);

            board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

            let totalTiles = ROWS * COLS;
            let pairs = [];
            for (let i = 0; i < totalTiles / 2; i++) {
                let typeIdx = (i % NUM_TYPES) + 1;
                pairs.push(typeIdx, typeIdx);
            }

            pairs.sort(() => Math.random() - 0.5);

            let idx = 0;
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    board[r][c] = pairs[idx++];
                }
            }

            checkAndShuffleIfNeeded();
            renderBoard();
            setTimeout(updateTileDimensions, 50);
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS + 2; r++) {
                for (let c = 0; c < COLS + 2; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');

                    if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                        tile.classList.add('border');
                    } else if (board[r][c] === -1) {
                        tile.classList.add('empty');
                    } else {
                        const img = document.createElement('img');
                        img.classList.add('pokemon-img');
                        img.src = `images/pieces${board[r][c]}.png`;
                        tile.appendChild(img);

                        tile.addEventListener('click', () => onTileClick(r, c));
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function onTileClick(r, c) {
            if (board[r][c] === -1 || isPaused) return;

            const currentTile = { r, c };

            if (!selectedTile) {
                playSound(sndClick);
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    getTileEl(r, c).classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                if (board[selectedTile.r][selectedTile.c] === board[r][c]) {
                    const path = findPath(selectedTile, currentTile);
                    if (path) {
                        if (!isGameStarted) {
                            isGameStarted = true;
                            playThemeMusic();
                            timerId = setInterval(updateTimer, 1000);
                        }

                        clearActiveHints();

                        drawPath(path);
                        playSound(sndConnect);
                        
                        board[selectedTile.r][selectedTile.c] = -1;
                        board[r][c] = -1;
                        
                        score += 10;
                        document.getElementById('score').innerText = score;

                        applyStageMovement(selectedTile, currentTile);

                        selectedTile = null;

                        setTimeout(() => {
                            clearPath();
                            if (!checkWin()) {
                                checkAndShuffleIfNeeded();
                                renderBoard();
                                updateTileDimensions();
                            }
                        }, 150);
                        return;
                    }
                }

                playSound(sndStop);
                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            }
        }

        function applyStageMovement(p1, p2) {
            let stage = currentLevel;
            
            if (stage === 1) return;

            let points = [p1, p2];

            if (stage === 2) {
                points.forEach(p => shiftColumnDown(p.c));
            } else if (stage === 3) {
                points.forEach(p => shiftColumnUp(p.c));
            } else if (stage === 4) {
                points.forEach(p => shiftRowLeft(p.r));
            } else if (stage === 5) {
                points.forEach(p => shiftRowRight(p.r));
            } else if (stage === 6) {
                points.forEach(p => {
                    if (p.r <= Math.floor(ROWS / 2)) shiftColumnUpHalf(p.c, 1, Math.floor(ROWS / 2));
                    else shiftColumnDownHalf(p.c, Math.floor(ROWS / 2) + 1, ROWS);
                });
            } else if (stage === 7) {
                points.forEach(p => {
                    if (p.r <= Math.floor(ROWS / 2)) shiftColumnDownHalf(p.c, 1, Math.floor(ROWS / 2));
                    else shiftColumnUpHalf(p.c, Math.floor(ROWS / 2) + 1, ROWS);
                });
            } else if (stage === 8) {
                points.forEach(p => {
                    if (p.c <= Math.floor(COLS / 2)) shiftRowLeftHalf(p.r, 1, Math.floor(COLS / 2));
                    else shiftRowRightHalf(p.r, Math.floor(COLS / 2) + 1, COLS);
                });
            } else if (stage === 9) {
                points.forEach(p => {
                    if (p.c <= Math.floor(COLS / 2)) shiftRowRightHalf(p.r, 1, Math.floor(COLS / 2));
                    else shiftRowLeftHalf(p.r, Math.floor(COLS / 2) + 1, COLS);
                });
            }
        }

        function shiftColumnDown(c) {
            let newCol = [];
            for (let r = 1; r <= ROWS; r++) if (board[r][c] !== -1) newCol.push(board[r][c]);
            let idx = newCol.length - 1;
            for (let r = ROWS; r >= 1; r--) board[r][c] = idx >= 0 ? newCol[idx--] : -1;
        }

        function shiftColumnUp(c) {
            let newCol = [];
            for (let r = 1; r <= ROWS; r++) if (board[r][c] !== -1) newCol.push(board[r][c]);
            let idx = 0;
            for (let r = 1; r <= ROWS; r++) board[r][c] = idx < newCol.length ? newCol[idx++] : -1;
        }

        function shiftRowLeft(r) {
            let newRow = [];
            for (let c = 1; c <= COLS; c++) if (board[r][c] !== -1) newRow.push(board[r][c]);
            let idx = 0;
            for (let c = 1; c <= COLS; c++) board[r][c] = idx < newRow.length ? newRow[idx++] : -1;
        }

        function shiftRowRight(r) {
            let newRow = [];
            for (let c = 1; c <= COLS; c++) if (board[r][c] !== -1) newRow.push(board[r][c]);
            let idx = newRow.length - 1;
            for (let c = COLS; c >= 1; c--) board[r][c] = idx >= 0 ? newRow[idx--] : -1;
        }

        function shiftColumnUpHalf(c, startR, endR) {
            let newCol = [];
            for (let r = startR; r <= endR; r++) if (board[r][c] !== -1) newCol.push(board[r][c]);
            let idx = 0;
            for (let r = startR; r <= endR; r++) board[r][c] = idx < newCol.length ? newCol[idx++] : -1;
        }

        function shiftColumnDownHalf(c, startR, endR) {
            let newCol = [];
            for (let r = startR; r <= endR; r++) if (board[r][c] !== -1) newCol.push(board[r][c]);
            let idx = newCol.length - 1;
            for (let r = endR; r >= startR; r--) board[r][c] = idx >= 0 ? newCol[idx--] : -1;
        }

        function shiftRowLeftHalf(r, startC, endC) {
            let newRow = [];
            for (let c = startC; c <= endC; c++) if (board[r][c] !== -1) newRow.push(board[r][c]);
            let idx = 0;
            for (let c = startC; c <= endC; c++) board[r][c] = idx < newRow.length ? newRow[idx++] : -1;
        }

        function shiftRowRightHalf(r, startC, endC) {
            let newRow = [];
            for (let c = startC; c <= endC; c++) if (board[r][c] !== -1) newRow.push(board[r][c]);
            let idx = newRow.length - 1;
            for (let c = endC; c >= startC; c--) board[r][c] = idx >= 0 ? newRow[idx--] : -1;
        }

        function checkAndShuffleIfNeeded() {
            while (getAllValidPairs().length === 0) {
                if (isBoardEmpty()) break;
                shuffleRemainingTiles();
            }
        }

        function getAllValidPairs() {
            let validPairs = [];
            let activeTiles = [];

            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) {
                        activeTiles.push({ r, c, type: board[r][c] });
                    }
                }
            }

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].type === activeTiles[j].type) {
                        const path = findPath(activeTiles[i], activeTiles[j]);
                        if (path) {
                            validPairs.push([activeTiles[i], activeTiles[j]]);
                        }
                    }
                }
            }
            return validPairs;
        }

        function shuffleRemainingTiles() {
            let activePositions = [];
            let activeValues = [];

            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) {
                        activePositions.push({ r, c });
                        activeValues.push(board[r][c]);
                    }
                }
            }

            activeValues.sort(() => Math.random() - 0.5);

            for (let i = 0; i < activePositions.length; i++) {
                const pos = activePositions[i];
                board[pos.r][pos.c] = activeValues[i];
            }
        }

        function isBoardEmpty() {
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) return false;
                }
            }
            return true;
        }

        function getTileEl(r, c) {
            return boardEl.children[r * (COLS + 2) + c];
        }

        function findPath(p1, p2) {
            if (p1.r === p2.r && checkLineX(p1.c, p2.c, p1.r)) return [p1, p2];
            if (p1.c === p2.c && checkLineY(p1.r, p2.r, p1.c)) return [p1, p2];

            if (board[p1.r][p2.c] === -1 && checkLineX(p1.c, p2.c, p1.r) && checkLineY(p1.r, p2.r, p2.c)) {
                return [p1, { r: p1.r, c: p2.c }, p2];
            }
            if (board[p2.r][p1.c] === -1 && checkLineY(p1.r, p2.r, p1.c) && checkLineX(p1.c, p2.c, p2.r)) {
                return [p1, { r: p2.r, c: p1.c }, p2];
            }

            for (let c = 0; c < COLS + 2; c++) {
                if (c === p1.c) continue;
                if (checkLineX(p1.c, c, p1.r) && 
                    board[p1.r][c] === -1 && board[p2.r][c] === -1 &&
                    checkLineY(p1.r, p2.r, c) && 
                    checkLineX(c, p2.c, p2.r)) {
                    return [p1, { r: p1.r, c: c }, { r: p2.r, c: c }, p2];
                }
            }

            for (let r = 0; r < ROWS + 2; r++) {
                if (r === p1.r) continue;
                if (checkLineY(p1.r, r, p1.c) && 
                    board[r][p1.c] === -1 && board[r][p2.c] === -1 &&
                    checkLineX(p1.c, p2.c, r) && 
                    checkLineY(r, p2.r, p2.c)) {
                    return [p1, { r: r, c: p1.c }, { r: r, c: p2.c }, p2];
                }
            }

            return null;
        }

        function checkLineX(c1, c2, r) {
            const min = Math.min(c1, c2);
            const max = Math.max(c1, c2);
            for (let c = min + 1; c < max; c++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function checkLineY(r1, r2, c) {
            const min = Math.min(r1, r2);
            const max = Math.max(r1, r2);
            for (let r = min + 1; r < max; r++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function drawPath(path) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 4;

            for (let i = 0; i < path.length; i++) {
                const x = path[i].c * tileW + tileW / 2;
                const y = path[i].r * tileH + tileH / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function clearPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('hp-bar').style.width = (timeLeft / GAME_TIME * 100) + '%';
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert('Hết giờ! Game Over.');
                initGame(true);
            }
        }

        function checkWin() {
            if (isBoardEmpty()) {
                clearInterval(timerId);
                if (currentLevel >= 9) {
                    alert('Chúc mừng! Bạn đã hoàn thành xuất sắc toàn bộ 9 Stage!');
                    initGame(true);
                } else {
                    alert(`Chúc mừng! Bạn đã vượt qua Stage ${currentLevel}`);
                    currentLevel++;
                    initGame(false);
                }
                return true;
            }
            return false;
        }

        window.addEventListener('resize', updateTileDimensions);
        window.onload = () => initGame(true);
    </script>
</body>
</html>
