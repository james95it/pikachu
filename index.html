<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikachu Classic 2003</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            /* Cài đặt hình nền background.jpg từ thư mục images */
            background: #000 url('images/background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            padding: 2px;
        }

        /* Khung thông tin phía trên */
        #top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .level-info {
            color: #ff3333;
            font-weight: bold;
            font-size: clamp(14px, 2.5vw, 18px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level-icon {
            width: 16px;
            height: 16px;
            background: #ff3333;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid #fff;
        }

        .hp-bar-container {
            flex: 1;
            max-width: 500px;
            margin: 0 10px;
            height: 16px;
            background: #111;
            border: 2px solid #555;
            overflow: hidden;
            border-radius: 4px;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #2563eb, #ec4899, #f97316, #eab308);
            transition: width 0.2s linear;
        }

        .score-info {
            color: #eab308;
            font-weight: bold;
            font-size: clamp(14px, 2.5vw, 18px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #fullscreen-btn {
            background: #333;
            color: #fff;
            border: 1px solid #777;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Khung chứa bàn chơi - Thu nhỏ hơn một chút */
        #game-container {
            position: relative;
            background: rgba(112, 128, 144, 0.95);
            padding: 0;
            border: 2px solid #4682b4;
            max-width: 100vw;
            overflow: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border-radius: 4px;
        }

        /* Giảm nhẹ kích thước ô để ảnh vừa vặn, không bị kéo vỡ nét */
        #board {
            display: grid;
            grid-template-columns: repeat(18, var(--tile-w, 50px));
            grid-template-rows: repeat(11, var(--tile-h, 56px));
            gap: 0px;
            background-color: #708090;
        }

        /* Ô vuông Pikachu */
        .tile {
            width: var(--tile-w, 50px);
            height: var(--tile-h, 56px);
            background-color: #dbe0e6;
            border: 1px solid #a0a0a0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .tile:hover {
            background-color: #ffffff;
        }

        .tile.selected {
            background-color: #fde047 !important;
            border: 2px solid #ff0000;
        }

        .tile.empty, .tile.border {
            visibility: hidden;
            pointer-events: none;
        }

        /* Sửa hiệu ứng render để ảnh hiển thị mịn và sắc nét */
        .pokemon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
            display: block;
        }

        canvas#line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        @media (max-width: 950px) {
            :root {
                --tile-w: calc(98vw / 18);
                --tile-h: calc((98vw / 18) * 1.12);
            }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="level-info"><span class="level-icon"></span> 1/999</div>
        <div class="hp-bar-container">
            <div id="hp-bar"></div>
        </div>
        <div class="score-info">
            <span>🎖️ <span id="score">0</span></span>
            <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
        </div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        <canvas id="line-canvas"></canvas>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 16;
        const NUM_TYPES = 36;

        let tileW = 50;
        let tileH = 56;

        const sndClick = new Audio('audio/click.mp3');
        const sndConnect = new Audio('audio/connect.mp3');
        const sndStop = new Audio('audio/stop.mp3');
        const sndTheme = new Audio('audio/theme.mp3');
        sndTheme.loop = true;

        let isThemePlaying = false;

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function playThemeMusic() {
            if (!isThemePlaying) {
                sndTheme.play().then(() => {
                    isThemePlaying = true;
                }).catch(() => {});
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        let board = [];
        let selectedTile = null;
        let score = 0;
        let timeLeft = 300;
        let timerId = null;

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function updateTileDimensions() {
            const firstTile = document.querySelector('.tile');
            if (firstTile) {
                const rect = firstTile.getBoundingClientRect();
                tileW = rect.width;
                tileH = rect.height;
                canvas.width = (COLS + 2) * tileW;
                canvas.height = (ROWS + 2) * tileH;
            }
        }

        function initGame() {
            score = 0;
            timeLeft = 300;
            selectedTile = null;
            
            document.getElementById('score').innerText = score;

            clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);

            board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

            let totalTiles = ROWS * COLS;
            let pairs = [];
            for (let i = 0; i < totalTiles / 2; i++) {
                let typeIdx = (i % NUM_TYPES) + 1;
                pairs.push(typeIdx, typeIdx);
            }

            pairs.sort(() => Math.random() - 0.5);

            let idx = 0;
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    board[r][c] = pairs[idx++];
                }
            }

            checkAndShuffleIfNeeded();
            renderBoard();
            setTimeout(updateTileDimensions, 50);
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS + 2; r++) {
                for (let c = 0; c < COLS + 2; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');

                    if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                        tile.classList.add('border');
                    } else if (board[r][c] === -1) {
                        tile.classList.add('empty');
                    } else {
                        const img = document.createElement('img');
                        img.classList.add('pokemon-img');
                        img.src = `images/pieces${board[r][c]}.png`;
                        tile.appendChild(img);

                        tile.addEventListener('click', () => onTileClick(r, c));
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function onTileClick(r, c) {
            if (board[r][c] === -1) return;

            playThemeMusic();

            const currentTile = { r, c };

            if (!selectedTile) {
                playSound(sndClick);
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    getTileEl(r, c).classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                if (board[selectedTile.r][selectedTile.c] === board[r][c]) {
                    const path = findPath(selectedTile, currentTile);
                    if (path) {
                        drawPath(path);
                        playSound(sndConnect);
                        
                        board[selectedTile.r][selectedTile.c] = -1;
                        board[r][c] = -1;
                        
                        score += 10;
                        document.getElementById('score').innerText = score;

                        selectedTile = null;

                        setTimeout(() => {
                            clearPath();
                            if (!checkWin()) {
                                checkAndShuffleIfNeeded();
                                renderBoard();
                                updateTileDimensions();
                            }
                        }, 150);
                        return;
                    }
                }

                playSound(sndStop);
                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            }
        }

        function checkAndShuffleIfNeeded() {
            while (getAllValidPairs().length === 0) {
                if (isBoardEmpty()) break;
                shuffleRemainingTiles();
            }
        }

        function getAllValidPairs() {
            let validPairs = [];
            let activeTiles = [];

            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) {
                        activeTiles.push({ r, c, type: board[r][c] });
                    }
                }
            }

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].type === activeTiles[j].type) {
                        const path = findPath(activeTiles[i], activeTiles[j]);
                        if (path) {
                            validPairs.push([activeTiles[i], activeTiles[j]]);
                        }
                    }
                }
            }
            return validPairs;
        }

        function shuffleRemainingTiles() {
            let activePositions = [];
            let activeValues = [];

            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) {
                        activePositions.push({ r, c });
                        activeValues.push(board[r][c]);
                    }
                }
            }

            activeValues.sort(() => Math.random() - 0.5);

            for (let i = 0; i < activePositions.length; i++) {
                const pos = activePositions[i];
                board[pos.r][pos.c] = activeValues[i];
            }
        }

        function isBoardEmpty() {
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) return false;
                }
            }
            return true;
        }

        function getTileEl(r, c) {
            return boardEl.children[r * (COLS + 2) + c];
        }

        function findPath(p1, p2) {
            if (p1.r === p2.r && checkLineX(p1.c, p2.c, p1.r)) return [p1, p2];
            if (p1.c === p2.c && checkLineY(p1.r, p2.r, p1.c)) return [p1, p2];

            if (board[p1.r][p2.c] === -1 && checkLineX(p1.c, p2.c, p1.r) && checkLineY(p1.r, p2.r, p2.c)) {
                return [p1, { r: p1.r, c: p2.c }, p2];
            }
            if (board[p2.r][p1.c] === -1 && checkLineY(p1.r, p2.r, p1.c) && checkLineX(p1.c, p2.c, p2.r)) {
                return [p1, { r: p2.r, c: p1.c }, p2];
            }

            for (let c = 0; c < COLS + 2; c++) {
                if (c === p1.c) continue;
                if (checkLineX(p1.c, c, p1.r) && 
                    board[p1.r][c] === -1 && board[p2.r][c] === -1 &&
                    checkLineY(p1.r, p2.r, c) && 
                    checkLineX(c, p2.c, p2.r)) {
                    return [p1, { r: p1.r, c: c }, { r: p2.r, c: c }, p2];
                }
            }

            for (let r = 0; r < ROWS + 2; r++) {
                if (r === p1.r) continue;
                if (checkLineY(p1.r, r, p1.c) && 
                    board[r][p1.c] === -1 && board[r][p2.c] === -1 &&
                    checkLineX(p1.c, p2.c, r) && 
                    checkLineY(r, p2.r, p2.c)) {
                    return [p1, { r: r, c: p1.c }, { r: r, c: p2.c }, p2];
                }
            }

            return null;
        }

        function checkLineX(c1, c2, r) {
            const min = Math.min(c1, c2);
            const max = Math.max(c1, c2);
            for (let c = min + 1; c < max; c++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function checkLineY(r1, r2, c) {
            const min = Math.min(r1, r2);
            const max = Math.max(r1, r2);
            for (let r = min + 1; r < max; r++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function drawPath(path) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 4;

            for (let i = 0; i < path.length; i++) {
                const x = path[i].c * tileW + tileW / 2;
                const y = path[i].r * tileH + tileH / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function clearPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('hp-bar').style.width = (timeLeft / 300 * 100) + '%';
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert('Hết giờ!');
                initGame();
            }
        }

        function checkWin() {
            if (isBoardEmpty()) {
                clearInterval(timerId);
                alert('Thắng cuộc!');
                initGame();
                return true;
            }
            return false;
        }

        window.addEventListener('resize', updateTileDimensions);
        window.onload = initGame;
    </script>
</body>
</html>
