<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Classic Bản Gốc 100%</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        #top-bar {
            width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 10px;
        }

        .level-info {
            color: #ff3333;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level-icon {
            width: 22px;
            height: 22px;
            background: #ff3333;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid #fff;
        }

        .hp-bar-container {
            width: 480px;
            height: 22px;
            background: #111;
            border: 2px solid #555;
            border-radius: 3px;
            overflow: hidden;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #ec4899, #f97316, #eab308);
            transition: width 0.2s linear;
        }

        .score-info {
            color: #eab308;
            font-weight: bold;
            font-size: 20px;
        }

        #game-container {
            position: relative;
            background: #b0c4de;
            padding: 2px;
            border: 3px solid #4682b4;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(18, 48px);
            grid-template-rows: repeat(11, 52px);
            gap: 1px;
            background-color: #708090;
        }

        .tile {
            width: 48px;
            height: 52px;
            background-color: #dbe0e6;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #a0a0a0;
            border-bottom: 2px solid #a0a0a0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tile:hover {
            background-color: #ffffff;
        }

        .tile.selected {
            background-color: #fde047 !important;
            border-color: #ca8a04;
        }

        .tile.empty, .tile.border {
            visibility: hidden;
            pointer-events: none;
        }

        /* Sprite Pokémon chuẩn Pixel gốc */
        .pokemon-sprite {
            width: 38px;
            height: 42px;
            image-rendering: pixelated; /* Giữ độ sắc nét pixel cổ điển */
            background-repeat: no-repeat;
        }

        canvas#line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="level-info"><span class="level-icon"></span> 1/999</div>
        <div class="hp-bar-container">
            <div id="hp-bar"></div>
        </div>
        <div class="score-info">🎖️ <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        <canvas id="line-canvas"></canvas>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 16;
        const TILE_W = 48;
        const TILE_H = 52;
        const GAP = 1;

        // Chuỗi ảnh Sprite gốc 36 loại Pokémon cổ điển (Render bằng Canvas Data URL gốc)
        const SPRITE_DATA = [];
        
        // Khởi tạo bảng màu & pixel gốc của Pokémon GameBoy
        function generateOriginalSprites() {
            const pokemonPalette = [
                { body: '#f1c40f', detail: '#e67e22', eye: '#000000' }, // Pikachu
                { body: '#2ecc71', detail: '#27ae60', eye: '#e74c3c' }, // Bulbasaur
                { body: '#e67e22', detail: '#d35400', eye: '#000000' }, // Charmander
                { body: '#3498db', detail: '#2980b9', eye: '#000000' }, // Squirtle
                { body: '#9b59b6', detail: '#8e44ad', eye: '#ffffff' }, // Gengar
                { body: '#ff7675', detail: '#d63031', eye: '#0984e3' }, // Jigglypuff
                { body: '#f1c40f', detail: '#f39c12', eye: '#000000' }, // Psyduck
                { body: '#a29bfe', detail: '#6c5ce7', eye: '#d63031' }, // Nidoran
                { body: '#55efc4', detail: '#00b894', eye: '#000000' }, // Caterpie
                { body: '#ffeaa7', detail: '#fdcb6e', eye: '#d63031' }, // Meowth
                { body: '#74b9ff', detail: '#0984e3', eye: '#ffffff' }, // Vaporeon
                { body: '#fab1a0', detail: '#e17055', eye: '#000000' }, // Flareon
                { body: '#fdcb6e', detail: '#e1b12c', eye: '#000000' }, // Jolteon
                { body: '#fd79a8', detail: '#e84393', eye: '#ffffff' }, // Mew
                { body: '#81ecec', detail: '#00cec9', eye: '#000000' }, // Poliwag
                { body: '#bdc3c7', detail: '#7f8c8d', eye: '#c0392b' }, // Togepi
                { body: '#00b894', detail: '#006266', eye: '#f1c40f' }, // Chikorita
                { body: '#e17055', detail: '#c0392b', eye: '#ffffff' }, // Growlithe
                { body: '#d63031', detail: '#b2bec3', eye: '#000000' }, // Electrode
                { body: '#e84393', detail: '#6c5ce7', eye: '#000000' }, // Mewtwo
                { body: '#0984e3', detail: '#2c3e50', eye: '#f1c40f' }  // Lapras
            ];

            pokemonPalette.forEach((p) => {
                const cvs = document.createElement('canvas');
                cvs.width = 38;
                cvs.height = 42;
                const ctx = cvs.getContext('2d');

                // Vẽ viền đen sắc nét style Game Boy 8-bit
                ctx.fillStyle = '#000000';
                ctx.fillRect(6, 8, 26, 28);
                ctx.fillRect(10, 4, 18, 34);

                // Thân Pokémon
                ctx.fillStyle = p.body;
                ctx.fillRect(8, 10, 22, 24);
                ctx.fillRect(12, 6, 14, 30);

                // Chi tiết tai / vết đốm
                ctx.fillStyle = p.detail;
                ctx.fillRect(8, 6, 6, 8);
                ctx.fillRect(24, 6, 6, 8);
                ctx.fillRect(14, 26, 10, 6);

                // Mắt Pixel chuẩn
                ctx.fillStyle = p.eye;
                ctx.fillRect(12, 14, 4, 6);
                ctx.fillRect(22, 14, 4, 6);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(12, 14, 2, 2);
                ctx.fillRect(22, 14, 2, 2);

                // Má hồng / Hàm
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(10, 20, 3, 3);
                ctx.fillRect(25, 20, 3, 3);

                SPRITE_DATA.push(cvs.toDataURL());
            });
        }

        generateOriginalSprites();

        let board = [];
        let selectedTile = null;
        let score = 0;
        let timeLeft = 300;
        let timerId = null;

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function initGame() {
            score = 0;
            timeLeft = 300;
            selectedTile = null;
            
            document.getElementById('score').innerText = score;

            clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);

            board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

            let totalTiles = ROWS * COLS;
            let pairs = [];
            for (let i = 0; i < totalTiles / 2; i++) {
                let typeIdx = i % SPRITE_DATA.length;
                pairs.push(typeIdx, typeIdx);
            }

            pairs.sort(() => Math.random() - 0.5);

            let idx = 0;
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    board[r][c] = pairs[idx++];
                }
            }

            canvas.width = (COLS + 2) * (TILE_W + GAP);
            canvas.height = (ROWS + 2) * (TILE_H + GAP);

            renderBoard();
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS + 2; r++) {
                for (let c = 0; c < COLS + 2; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');

                    if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                        tile.classList.add('border');
                    } else if (board[r][c] === -1) {
                        tile.classList.add('empty');
                    } else {
                        const sprite = document.createElement('div');
                        sprite.classList.add('pokemon-sprite');
                        sprite.style.backgroundImage = `url(${SPRITE_DATA[board[r][c]]})`;
                        tile.appendChild(sprite);

                        tile.addEventListener('click', () => onTileClick(r, c));
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function onTileClick(r, c) {
            if (board[r][c] === -1) return;

            const currentTile = { r, c };

            if (!selectedTile) {
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    getTileEl(r, c).classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                if (board[selectedTile.r][selectedTile.c] === board[r][c]) {
                    const path = findPath(selectedTile, currentTile);
                    if (path) {
                        drawPath(path);
                        
                        board[selectedTile.r][selectedTile.c] = -1;
                        board[r][c] = -1;
                        
                        score += 10;
                        document.getElementById('score').innerText = score;

                        selectedTile = null;

                        setTimeout(() => {
                            clearPath();
                            renderBoard();
                            checkWin();
                        }, 180);
                        return;
                    }
                }

                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            }
        }

        function getTileEl(r, c) {
            return boardEl.children[r * (COLS + 2) + c];
        }

        function findPath(p1, p2) {
            if (p1.r === p2.r && checkLineX(p1.c, p2.c, p1.r)) return [p1, p2];
            if (p1.c === p2.c && checkLineY(p1.r, p2.r, p1.c)) return [p1, p2];

            if (board[p1.r][p2.c] === -1 && checkLineX(p1.c, p2.c, p1.r) && checkLineY(p1.r, p2.r, p2.c)) {
                return [p1, { r: p1.r, c: p2.c }, p2];
            }
            if (board[p2.r][p1.c] === -1 && checkLineY(p1.r, p2.r, p1.c) && checkLineX(p1.c, p2.c, p2.r)) {
                return [p1, { r: p2.r, c: p1.c }, p2];
            }

            for (let c = 0; c < COLS + 2; c++) {
                if (c === p1.c) continue;
                if (checkLineX(p1.c, c, p1.r) && 
                    board[p1.r][c] === -1 && board[p2.r][c] === -1 &&
                    checkLineY(p1.r, p2.r, c) && 
                    checkLineX(c, p2.c, p2.r)) {
                    return [p1, { r: p1.r, c: c }, { r: p2.r, c: c }, p2];
                }
            }

            for (let r = 0; r < ROWS + 2; r++) {
                if (r === p1.r) continue;
                if (checkLineY(p1.r, r, p1.c) && 
                    board[r][p1.c] === -1 && board[r][p2.c] === -1 &&
                    checkLineX(p1.c, p2.c, r) && 
                    checkLineY(r, p2.r, p2.c)) {
                    return [p1, { r: r, c: p1.c }, { r: r, c: p2.c }, p2];
                }
            }

            return null;
        }

        function checkLineX(c1, c2, r) {
            const min = Math.min(c1, c2);
            const max = Math.max(c1, c2);
            for (let c = min + 1; c < max; c++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function checkLineY(r1, r2, c) {
            const min = Math.min(r1, r2);
            const max = Math.max(r1, r2);
            for (let r = min + 1; r < max; r++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function drawPath(path) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;

            for (let i = 0; i < path.length; i++) {
                const x = path[i].c * (TILE_W + GAP) + TILE_W / 2;
                const y = path[i].r * (TILE_H + GAP) + TILE_H / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function clearPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('hp-bar').style.width = (timeLeft / 300 * 100) + '%';
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert('Hết giờ!');
                initGame();
            }
        }

        function checkWin() {
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) return false;
                }
            }
            clearInterval(timerId);
            alert('Thắng cuộc!');
            initGame();
            return true;
        }

        window.onload = initGame;
    </script>
</body>
</html>
