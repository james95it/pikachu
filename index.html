<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Nối Hình Cổ Điển</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            margin-bottom: 15px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
            font-size: 28px;
        }

        #panel {
            background: #34495e;
            padding: 12px 25px;
            border-radius: 8px;
            display: flex;
            gap: 25px;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 2px solid #7f8c8d;
        }

        .stat-item {
            font-size: 16px;
            font-weight: bold;
        }

        .stat-value {
            color: #e74c3c;
            font-size: 20px;
        }

        button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #27ae60;
            border: 1px solid #2ecc71;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #2ecc71;
        }

        #game-container {
            position: relative;
            background: #111;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 3px solid #7f8c8d;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(18, 52px);
            grid-template-rows: repeat(11, 52px);
            gap: 2px;
            background-color: #1e272e;
        }

        .tile {
            width: 52px;
            height: 52px;
            background-color: #ecf0f1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
            border: 1px solid #bdc3c7;
        }

        .tile svg, .tile img {
            width: 44px;
            height: 44px;
            pointer-events: none;
        }

        .tile:hover {
            background-color: #dcdde1;
            transform: scale(1.05);
        }

        .tile.selected {
            background-color: #f1c40f !important;
            border: 2px solid #e67e22;
            transform: scale(1.05);
        }

        .tile.hint {
            background-color: #3498db !important;
            animation: blink 0.4s infinite alternate;
        }

        .tile.empty, .tile.border {
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        canvas {
            position: absolute;
            top: 12px;
            left: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>PIKACHU CỔ ĐIỂN</h1>

    <div id="panel">
        <div class="stat-item">ĐIỂM: <span id="score" class="stat-value">0</span></div>
        <div class="stat-item">THỜI GIAN: <span id="timer" class="stat-value">300</span>S</div>
        <button onclick="useHint()">GỢI Ý</button>
        <button onclick="initGame()">CHƠI MỚI</button>
    </div>

    <div id="game-container">
        <div id="board"></div>
        <canvas id="line-canvas"></canvas>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 16;
        const TILE_SIZE = 52;
        const GAP = 2;

        // Bộ Icon SVG chuẩn định dạng Pixel Art cổ điển tích hợp thẳng vào file HTML
        const PIKACHU_SPRITES = [
            // 0: Pikachu
            `<svg viewBox="0 0 32 32"><path fill="#f1c40f" d="M10 8h2v4h-2zm10 0h2v4h-2zM8 12h16v12H8z"/><path fill="#e74c3c" d="M10 18h3v3h-3zm9 0h3v3h-3z"/><path fill="#000" d="M12 14h2v2h-2zm8 0h2v2h-2zm-6 5h4v1h-4z"/></svg>`,
            // 1: Bulbasaur
            `<svg viewBox="0 0 32 32"><path fill="#2ecc71" d="M8 10h16v14H8z"/><path fill="#27ae60" d="M11 6h10v4H11z"/><path fill="#e74c3c" d="M10 14h3v3h-3zm9 0h3v3h-3z"/></svg>`,
            // 2: Charmander
            `<svg viewBox="0 0 32 32"><path fill="#e67e22" d="M9 10h14v14H9z"/><path fill="#f1c40f" d="M12 18h5v6h-5z"/><path fill="#e74c3c" d="M23 18h3v4h-3z"/></svg>`,
            // 3: Squirtle
            `<svg viewBox="0 0 32 32"><path fill="#3498db" d="M9 10h14v14H9z"/><path fill="#f39c12" d="M11 16h10v7H11z"/><path fill="#2980b9" d="M7 14h2v6H7z"/></svg>`,
            // 4: Jigglypuff
            `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="#ff793f"/><circle cx="12" cy="14" r="3" fill="#3498db"/><circle cx="20" cy="14" r="3" fill="#3498db"/></svg>`,
            // 5: Meowth
            `<svg viewBox="0 0 32 32"><path fill="#f7f1e3" d="M9 10h14v14H9z"/><path fill="#f1c40f" d="M14 8h4v4h-4z"/><path fill="#b33939" d="M11 15h2v2h-2zm8 0h2v2h-2z"/></svg>`,
            // 6: Psyduck
            `<svg viewBox="0 0 32 32"><path fill="#f1c40f" d="M9 10h14v14H9z"/><path fill="#f7f1e3" d="M12 16h8v6h-8z"/><circle cx="12" cy="13" r="1" fill="#000"/><circle cx="20" cy="13" r="1" fill="#000"/></svg>`,
            // 7: Gengar
            `<svg viewBox="0 0 32 32"><path fill="#8e44ad" d="M7 10h18v14H7z"/><path fill="#e74c3c" d="M10 14h3v2h-3zm9 0h3v2h-3z"/><path fill="#fff" d="M11 18h10v2H11z"/></svg>`,
            // 8: Snorlax
            `<svg viewBox="0 0 32 32"><path fill="#2c3e50" d="M8 8h16v16H8z"/><path fill="#f7f1e3" d="M11 13h10v10H11z"/><path fill="#000" d="M12 15h2v1h-2zm6 0h2v1h-2z"/></svg>`,
            // 9: Eevee
            `<svg viewBox="0 0 32 32"><path fill="#cd6133" d="M9 10h14v14H9z"/><path fill="#f7f1e3" d="M10 18h12v6H10z"/><circle cx="12" cy="13" r="1" fill="#000"/><circle cx="20" cy="13" r="1" fill="#000"/></svg>`,
            // 10: Pokeball
            `<svg viewBox="0 0 32 32"><path fill="#e74c3c" d="M8 8h16v8H8z"/><path fill="#ecf0f1" d="M8 16h16v8H8z"/><circle cx="16" cy="16" r="3" fill="#2c3e50"/><circle cx="16" cy="16" r="1.5" fill="#fff"/></svg>`,
            // 11: Diglett
            `<svg viewBox="0 0 32 32"><path fill="#795548" d="M11 8h10v12H11z"/><path fill="#8d6e63" d="M7 20h18v4H7z"/><ellipse cx="16" cy="16" rx="3" ry="1.5" fill="#ff80ab"/></svg>`,
            // 12: Voltorb
            `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="#ecf0f1"/><path fill="#e74c3c" d="M6 16a10 10 0 0 1 20 0z"/><circle cx="16" cy="16" r="2" fill="#000"/></svg>`,
            // 13: Oddish
            `<svg viewBox="0 0 32 32"><circle cx="16" cy="18" r="7" fill="#303f9f"/><path fill="#4caf50" d="M12 6h3v6h-3zm5 0h3v6h-3z"/><circle cx="13" cy="18" r="1" fill="#e91e63"/><circle cx="19" cy="18" r="1" fill="#e91e63"/></svg>`,
            // 14: Poliwag
            `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="#1976d2"/><circle cx="16" cy="16" r="5" fill="#fff"/><path stroke="#000" stroke-width="1.5" fill="none" d="M16 14a2 2 0 1 0 2 2"/></svg>`,
            // 15: Abra
            `<svg viewBox="0 0 32 32"><path fill="#fbc02d" d="M9 10h14v14H9z"/><path fill="#795548" d="M11 13h10v5H11z"/><path fill="#000" d="M12 15h2v1h-2zm6 0h2v1h-2z"/></svg>`,
            // 16: Machop
            `<svg viewBox="0 0 32 32"><path fill="#90a4ae" d="M9 10h14v14H9z"/><path fill="#d32f2f" d="M12 13h2v3h-2zm6 0h2v3h-2z"/><path fill="#fff" d="M13 18h6v2h-6z"/></svg>`,
            // 17: Slowpoke
            `<svg viewBox="0 0 32 32"><path fill="#f48fb1" d="M8 10h16v14H8z"/><path fill="#ffe0b2" d="M12 16h8v6h-8z"/><circle cx="12" cy="13" r="1" fill="#000"/><circle cx="20" cy="13" r="1" fill="#000"/></svg>`,
            // 18: Magnemite
            `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="#b0bec5"/><circle cx="16" cy="16" r="3" fill="#fff"/><circle cx="16" cy="16" r="1" fill="#000"/><path fill="#e53935" d="M6 14h4v4H6z"/><path fill="#1e88e5" d="M22 14h4v4h-4z"/></svg>`,
            // 19: Gastly
            `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="#4a148c"/><circle cx="16" cy="16" r="7" fill="#212121"/><path fill="#fff" d="M11 14l3 2-3 2zm10 0l-3 2 3 2z"/></svg>`,
            // 20: Koffing
            `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="#7b1fa2"/><path stroke="#fff" stroke-width="2" d="M12 20l8-8m0 8l-8-8"/><circle cx="10" cy="10" r="2" fill="#b0bec5"/></svg>`
        ];

        const NUM_TYPES = PIKACHU_SPRITES.length;

        let board = [];
        let selectedTile = null;
        let score = 0;
        let timeLeft = 300;
        let timerId = null;

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function initGame() {
            score = 0;
            timeLeft = 300;
            selectedTile = null;
            
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;

            clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);

            board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

            let totalTiles = ROWS * COLS;
            let pairs = [];
            for (let i = 0; i < totalTiles / 2; i++) {
                let typeIdx = i % NUM_TYPES;
                pairs.push(typeIdx, typeIdx);
            }

            pairs.sort(() => Math.random() - 0.5);

            let idx = 0;
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    board[r][c] = pairs[idx++];
                }
            }

            canvas.width = (COLS + 2) * (TILE_SIZE + GAP);
            canvas.height = (ROWS + 2) * (TILE_SIZE + GAP);

            renderBoard();
            checkAndAutoShuffle();
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS + 2; r++) {
                for (let c = 0; c < COLS + 2; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');

                    if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                        tile.classList.add('border');
                    } else if (board[r][c] === -1) {
                        tile.classList.add('empty');
                    } else {
                        tile.innerHTML = PIKACHU_SPRITES[board[r][c]];
                        tile.addEventListener('click', () => onTileClick(r, c));
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function onTileClick(r, c) {
            if (board[r][c] === -1) return;

            const currentTile = { r, c };

            if (!selectedTile) {
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    getTileEl(r, c).classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                if (board[selectedTile.r][selectedTile.c] === board[r][c]) {
                    const path = findPath(selectedTile, currentTile);
                    if (path) {
                        drawPath(path);
                        
                        board[selectedTile.r][selectedTile.c] = -1;
                        board[r][c] = -1;
                        
                        score += 10;
                        document.getElementById('score').innerText = score;

                        selectedTile = null;

                        setTimeout(() => {
                            clearPath();
                            renderBoard();
                            checkAndAutoShuffle();
                            checkWin();
                        }, 200);
                        return;
                    }
                }

                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            }
        }

        function getTileEl(r, c) {
            return boardEl.children[r * (COLS + 2) + c];
        }

        function findPath(p1, p2) {
            if (p1.r === p2.r && checkLineX(p1.c, p2.c, p1.r)) return [p1, p2];
            if (p1.c === p2.c && checkLineY(p1.r, p2.r, p1.c)) return [p1, p2];

            if (board[p1.r][p2.c] === -1 && checkLineX(p1.c, p2.c, p1.r) && checkLineY(p1.r, p2.r, p2.c)) {
                return [p1, { r: p1.r, c: p2.c }, p2];
            }
            if (board[p2.r][p1.c] === -1 && checkLineY(p1.r, p2.r, p1.c) && checkLineX(p1.c, p2.c, p2.r)) {
                return [p1, { r: p2.r, c: p1.c }, p2];
            }

            for (let c = 0; c < COLS + 2; c++) {
                if (c === p1.c) continue;
                if (checkLineX(p1.c, c, p1.r) && 
                    board[p1.r][c] === -1 && board[p2.r][c] === -1 &&
                    checkLineY(p1.r, p2.r, c) && 
                    checkLineX(c, p2.c, p2.r)) {
                    return [p1, { r: p1.r, c: c }, { r: p2.r, c: c }, p2];
                }
            }

            for (let r = 0; r < ROWS + 2; r++) {
                if (r === p1.r) continue;
                if (checkLineY(p1.r, r, p1.c) && 
                    board[r][p1.c] === -1 && board[r][p2.c] === -1 &&
                    checkLineX(p1.c, p2.c, r) && 
                    checkLineY(r, p2.r, p2.c)) {
                    return [p1, { r: r, c: p1.c }, { r: r, c: p2.c }, p2];
                }
            }

            return null;
        }

        function checkLineX(c1, c2, r) {
            const min = Math.min(c1, c2);
            const max = Math.max(c1, c2);
            for (let c = min + 1; c < max; c++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function checkLineY(r1, r2, c) {
            const min = Math.min(r1, r2);
            const max = Math.max(r1, r2);
            for (let r = min + 1; r < max; r++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function drawPath(path) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            for (let i = 0; i < path.length; i++) {
                const x = path[i].c * (TILE_SIZE + GAP) + TILE_SIZE / 2;
                const y = path[i].r * (TILE_SIZE + GAP) + TILE_SIZE / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function clearPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function findAvailablePair() {
            let activeTiles = [];
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) activeTiles.push({ r, c, val: board[r][c] });
                }
            }

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].val === activeTiles[j].val) {
                        if (findPath(activeTiles[i], activeTiles[j])) {
                            return [activeTiles[i], activeTiles[j]];
                        }
                    }
                }
            }
            return null;
        }

        function checkAndAutoShuffle() {
            let pair = findAvailablePair();
            if (!pair) {
                let remainingValues = [];
                for (let r = 1; r <= ROWS; r++) {
                    for (let c = 1; c <= COLS; c++) {
                        if (board[r][c] !== -1) remainingValues.push(board[r][c]);
                    }
                }

                if (remainingValues.length === 0) return;

                do {
                    remainingValues.sort(() => Math.random() - 0.5);
                    let idx = 0;
                    for (let r = 1; r <= ROWS; r++) {
                        for (let c = 1; c <= COLS; c++) {
                            if (board[r][c] !== -1) board[r][c] = remainingValues[idx++];
                        }
                    }
                } while (!findAvailablePair());

                renderBoard();
            }
        }

        function useHint() {
            if (selectedTile) {
                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = null;
            }

            const pair = findAvailablePair();
            if (pair) {
                const el1 = getTileEl(pair[0].r, pair[0].c);
                const el2 = getTileEl(pair[1].r, pair[1].c);

                el1.classList.add('hint');
                el2.classList.add('hint');

                setTimeout(() => {
                    el1.classList.remove('hint');
                    el2.classList.remove('hint');
                }, 1200);
            }
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert('Hết giờ! Bạn đã thua cuộc.');
                initGame();
            }
        }

        function checkWin() {
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) return false;
                }
            }
            clearInterval(timerId);
            alert(`Chúc mừng! Bạn đã chiến thắng với ${score} điểm!`);
            initGame();
            return true;
        }

        window.onload = initGame;
    </script>
</body>
</html>
