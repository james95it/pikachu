<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Classic Original</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* Thanh Top-Bar Cầu Vồng Y Hệt Ảnh */
        #top-bar {
            width: 1000px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            padding: 0 10px;
        }

        .level-info {
            color: #ff3333;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .level-icon {
            width: 22px;
            height: 22px;
            background: #ff3333;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid #fff;
        }

        .hp-bar-container {
            width: 500px;
            height: 20px;
            background: #222;
            border: 2px solid #555;
            border-radius: 3px;
            overflow: hidden;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #ec4899, #f97316, #eab308);
            transition: width 0.2s linear;
        }

        .score-info {
            color: #eab308;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Bàn Chơi Ô Xám Viền Chuẩn Bản Gốc */
        #game-container {
            position: relative;
            background: #b0c4de;
            padding: 2px;
            border: 3px solid #4682b4;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(18, 54px);
            grid-template-rows: repeat(11, 58px);
            gap: 1px;
            background-color: #708090;
        }

        .tile {
            width: 54px;
            height: 58px;
            background-color: #dbe0e6;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #a0a0a0;
            border-bottom: 2px solid #a0a0a0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tile:hover {
            background-color: #ffffff;
        }

        .tile.selected {
            background-color: #fde047 !important;
            border-color: #ca8a04;
        }

        .tile.hint {
            background-color: #60a5fa !important;
        }

        .tile.empty, .tile.border {
            visibility: hidden;
            pointer-events: none;
        }

        canvas#line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="level-info"><span class="level-icon"></span> 1/999</div>
        <div class="hp-bar-container">
            <div id="hp-bar"></div>
        </div>
        <div class="score-info">🎖️ <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        <canvas id="line-canvas"></canvas>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 16;
        const TILE_W = 54;
        const TILE_H = 58;
        const GAP = 1;

        // Vẽ Sprite Pokémon Pixel chuẩn màu sắc như ảnh gốc 2003
        function createPokemonCanvas(id) {
            const canvas = document.createElement('canvas');
            canvas.width = 48;
            canvas.height = 48;
            const ctx = canvas.getContext('2d');
            
            const colors = [
                ['#fbbf24', '#d97706', '#ef4444'], // Pikachu
                ['#34d399', '#059669', '#ef4444'], // Bulbasaur
                ['#f97316', '#ea580c', '#facc15'], // Charmander
                ['#38bdf8', '#0284c7', '#f97316'], // Squirtle
                ['#a855f7', '#7e22ce', '#ffffff'], // Gengar/Purple
                ['#f43f5e', '#be123c', '#38bdf8'], // Jigglypuff
                ['#fde047', '#ca8a04', '#000000'], // Psyduck/Yellow
                ['#818cf8', '#4f46e5', '#f43f5e'], // Nidoran
                ['#a3e635', '#65a30d', '#ef4444'], // Caterpie/Green
                ['#fb7185', '#e11d48', '#fde047'], // Slowpoke/Pink
                ['#38bdf8', '#1d4ed8', '#ffffff'], // Vaporeon
                ['#f97316', '#c2410c', '#ffffff'], // Flareon
                ['#facc15', '#a16207', '#ffffff'], // Jolteon
                ['#94a3b8', '#475569', '#ef4444'], // Meowth
                ['#67e8f9', '#0891b2', '#000000'], // Poliwag
                ['#f472b6', '#db2777', '#fde047'], // Mew
                ['#f87171', '#dc2626', '#38bdf8'], // Togepi
                ['#4ade80', '#15803d', '#facc15'], // Chikorita
                ['#fb923c', '#9a3412', '#ffffff'], // Growlithe
                ['#c084fc', '#9333ea', '#ffffff'], // Mewtwo
                ['#a1a1aa', '#52525b', '#ef4444']  // Magnemite
            ];

            const c = colors[id % colors.length];

            // Thân chính Pixel
            ctx.fillStyle = c[0];
            ctx.beginPath();
            ctx.arc(24, 26, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Tai / Chi tiết trên
            ctx.fillStyle = c[1];
            ctx.fillRect(12, 8, 8, 10);
            ctx.strokeRect(12, 8, 8, 10);
            ctx.fillRect(28, 8, 8, 10);
            ctx.strokeRect(28, 8, 8, 10);

            // Mắt Pixel
            ctx.fillStyle = '#000000';
            ctx.fillRect(18, 22, 4, 5);
            ctx.fillRect(26, 22, 4, 5);

            // Má / Chi tiết đặc trưng
            ctx.fillStyle = c[2];
            ctx.fillRect(14, 28, 4, 4);
            ctx.fillRect(30, 28, 4, 4);

            return canvas.toDataURL();
        }

        const NUM_TYPES = 21;
        const POKEMON_SPRITES = [];
        for(let i = 0; i < NUM_TYPES; i++) {
            POKEMON_SPRITES.push(createPokemonCanvas(i));
        }

        let board = [];
        let selectedTile = null;
        let score = 0;
        let timeLeft = 300;
        let timerId = null;

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function initGame() {
            score = 0;
            timeLeft = 300;
            selectedTile = null;
            
            document.getElementById('score').innerText = score;

            clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);

            board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

            let totalTiles = ROWS * COLS;
            let pairs = [];
            for (let i = 0; i < totalTiles / 2; i++) {
                let typeIdx = i % NUM_TYPES;
                pairs.push(typeIdx, typeIdx);
            }

            pairs.sort(() => Math.random() - 0.5);

            let idx = 0;
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    board[r][c] = pairs[idx++];
                }
            }

            canvas.width = (COLS + 2) * (TILE_W + GAP);
            canvas.height = (ROWS + 2) * (TILE_H + GAP);

            renderBoard();
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS + 2; r++) {
                for (let c = 0; c < COLS + 2; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');

                    if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                        tile.classList.add('border');
                    } else if (board[r][c] === -1) {
                        tile.classList.add('empty');
                    } else {
                        const img = document.createElement('img');
                        img.src = POKEMON_SPRITES[board[r][c]];
                        img.style.width = '44px';
                        img.style.height = '44px';
                        tile.appendChild(img);

                        tile.addEventListener('click', () => onTileClick(r, c));
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function onTileClick(r, c) {
            if (board[r][c] === -1) return;

            const currentTile = { r, c };

            if (!selectedTile) {
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    getTileEl(r, c).classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                if (board[selectedTile.r][selectedTile.c] === board[r][c]) {
                    const path = findPath(selectedTile, currentTile);
                    if (path) {
                        drawPath(path);
                        
                        board[selectedTile.r][selectedTile.c] = -1;
                        board[r][c] = -1;
                        
                        score += 10;
                        document.getElementById('score').innerText = score;

                        selectedTile = null;

                        setTimeout(() => {
                            clearPath();
                            renderBoard();
                            checkWin();
                        }, 180);
                        return;
                    }
                }

                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            }
        }

        function getTileEl(r, c) {
            return boardEl.children[r * (COLS + 2) + c];
        }

        function findPath(p1, p2) {
            if (p1.r === p2.r && checkLineX(p1.c, p2.c, p1.r)) return [p1, p2];
            if (p1.c === p2.c && checkLineY(p1.r, p2.r, p1.c)) return [p1, p2];

            if (board[p1.r][p2.c] === -1 && checkLineX(p1.c, p2.c, p1.r) && checkLineY(p1.r, p2.r, p2.c)) {
                return [p1, { r: p1.r, c: p2.c }, p2];
            }
            if (board[p2.r][p1.c] === -1 && checkLineY(p1.r, p2.r, p1.c) && checkLineX(p1.c, p2.c, p2.r)) {
                return [p1, { r: p2.r, c: p1.c }, p2];
            }

            for (let c = 0; c < COLS + 2; c++) {
                if (c === p1.c) continue;
                if (checkLineX(p1.c, c, p1.r) && 
                    board[p1.r][c] === -1 && board[p2.r][c] === -1 &&
                    checkLineY(p1.r, p2.r, c) && 
                    checkLineX(c, p2.c, p2.r)) {
                    return [p1, { r: p1.r, c: c }, { r: p2.r, c: c }, p2];
                }
            }

            for (let r = 0; r < ROWS + 2; r++) {
                if (r === p1.r) continue;
                if (checkLineY(p1.r, r, p1.c) && 
                    board[r][p1.c] === -1 && board[r][p2.c] === -1 &&
                    checkLineX(p1.c, p2.c, r) && 
                    checkLineY(r, p2.r, p2.c)) {
                    return [p1, { r: r, c: p1.c }, { r: r, c: p2.c }, p2];
                }
            }

            return null;
        }

        function checkLineX(c1, c2, r) {
            const min = Math.min(c1, c2);
            const max = Math.max(c1, c2);
            for (let c = min + 1; c < max; c++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function checkLineY(r1, r2, c) {
            const min = Math.min(r1, r2);
            const max = Math.max(r1, r2);
            for (let r = min + 1; r < max; r++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function drawPath(path) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;

            for (let i = 0; i < path.length; i++) {
                const x = path[i].c * (TILE_W + GAP) + TILE_W / 2;
                const y = path[i].r * (TILE_H + GAP) + TILE_H / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function clearPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('hp-bar').style.width = (timeLeft / 300 * 100) + '%';
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert('Hết giờ!');
                initGame();
            }
        }

        function checkWin() {
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) return false;
                }
            }
            clearInterval(timerId);
            alert('Thắng cuộc!');
            initGame();
            return true;
        }

        window.onload = initGame;
    </script>
</body>
</html>
