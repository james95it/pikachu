<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Nối Hình Cổ Điển</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1e272e;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            margin-bottom: 12px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
            font-size: 28px;
            letter-spacing: 1px;
        }

        #panel {
            background: #2c3e50;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 25px;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #485460;
        }

        .stat-item {
            font-size: 16px;
            font-weight: bold;
        }

        .stat-value {
            color: #ff4757;
            font-size: 18px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #2ed573;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button:hover {
            background-color: #26af5f;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        #game-container {
            position: relative;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 2px solid #334155;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(18, 42px);
            grid-template-rows: repeat(11, 42px);
            gap: 2px;
            background-color: #1e293b;
        }

        .tile {
            width: 42px;
            height: 42px;
            background-color: #f1f2f6;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.3);
        }

        .tile img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            pointer-events: none;
        }

        .tile:hover {
            background-color: #dcdde1;
            transform: scale(1.05);
        }

        .tile.selected {
            background-color: #eccc68 !important;
            border: 2px solid #ffa502;
            transform: scale(1.05);
        }

        .tile.hint {
            background-color: #70a1ff !important;
            animation: blink 0.4s infinite alternate;
        }

        .tile.empty, .tile.border {
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        canvas {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>PIKACHU CỔ ĐIỂN</h1>

    <div id="panel">
        <div class="stat-item">Điểm: <span id="score" class="stat-value">0</span></div>
        <div class="stat-item">Thời gian: <span id="timer" class="stat-value">300</span>s</div>
        <button onclick="useHint()">Gợi ý</button>
        <button onclick="initGame()">Chơi mới</button>
    </div>

    <div id="game-container">
        <div id="board"></div>
        <canvas id="line-canvas"></canvas>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 16;
        const TILE_SIZE = 42;
        const GAP = 2;

        // Danh sách ID Pokémon Gen 1 cổ điển (Pikachu, Bulbasaur, Charmander, Squirtle, v.v.)
        const POKEMON_IDS = [25, 1, 4, 7, 12, 16, 19, 39, 52, 54, 60, 63, 74, 86, 92, 94, 129, 133, 143, 149, 150];
        const NUM_TYPES = POKEMON_IDS.length;

        let board = [];
        let selectedTile = null;
        let score = 0;
        let timeLeft = 300;
        let timerId = null;

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function getPokemonImageUrl(id) {
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
        }

        function initGame() {
            score = 0;
            timeLeft = 300;
            selectedTile = null;
            
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;

            clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);

            // Mảng dữ liệu kèm hàng/cột viền bao quanh (ROWS+2 x COLS+2)
            board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(0));

            // Tạo các cặp Pokémon ngẫu nhiên
            let totalTiles = ROWS * COLS;
            let pairs = [];
            for (let i = 0; i < totalTiles / 2; i++) {
                let typeIdx = i % NUM_TYPES;
                pairs.push(typeIdx, typeIdx);
            }

            // Trộn ngẫu nhiên
            pairs.sort(() => Math.random() - 0.5);

            // Đưa dữ liệu vào bàn chơi
            let idx = 0;
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    board[r][c] = pairs[idx++];
                }
            }

            // Cấu hình Kích thước Canvas vẽ đường nối
            canvas.width = (COLS + 2) * (TILE_SIZE + GAP);
            canvas.height = (ROWS + 2) * (TILE_SIZE + GAP);

            renderBoard();
            checkAndAutoShuffle();
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS + 2; r++) {
                for (let c = 0; c < COLS + 2; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.row = r;
                    tile.dataset.col = c;

                    if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                        tile.classList.add('border');
                    } else if (board[r][c] === -1 || board[r][c] === null) {
                        tile.classList.add('empty');
                    } else {
                        const img = document.createElement('img');
                        const pokeId = POKEMON_IDS[board[r][c]];
                        img.src = getPokemonImageUrl(pokeId);
                        img.alt = `Pokemon ${pokeId}`;
                        tile.appendChild(img);

                        tile.addEventListener('click', () => onTileClick(r, c));
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function onTileClick(r, c) {
            if (board[r][c] === -1) return;

            const currentTile = { r, c };

            if (!selectedTile) {
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    getTileEl(r, c).classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                if (board[selectedTile.r][selectedTile.c] === board[r][c]) {
                    const path = findPath(selectedTile, currentTile);
                    if (path) {
                        drawPath(path);
                        
                        // Đánh dấu biến mất
                        board[selectedTile.r][selectedTile.c] = -1;
                        board[r][c] = -1;
                        
                        score += 10;
                        document.getElementById('score').innerText = score;

                        selectedTile = null;

                        setTimeout(() => {
                            clearPath();
                            renderBoard();
                            checkAndAutoShuffle();
                            checkWin();
                        }, 200);
                        return;
                    }
                }

                // Chuyển chọn ô khác
                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = currentTile;
                getTileEl(r, c).classList.add('selected');
            }
        }

        function getTileEl(r, c) {
            return boardEl.children[r * (COLS + 2) + c];
        }

        // --- THUẬT TOÁN TÌM ĐƯỜNG NỐI PIKACHU (Tối đa 2 góc vuông) ---
        function findPath(p1, p2) {
            if (p1.r === p2.r && checkLineX(p1.c, p2.c, p1.r)) {
                return [p1, p2];
            }
            if (p1.c === p2.c && checkLineY(p1.r, p2.r, p1.c)) {
                return [p1, p2];
            }

            if (board[p1.r][p2.c] === -1 && checkLineX(p1.c, p2.c, p1.r) && checkLineY(p1.r, p2.r, p2.c)) {
                return [p1, { r: p1.r, c: p2.c }, p2];
            }
            if (board[p2.r][p1.c] === -1 && checkLineY(p1.r, p2.r, p1.c) && checkLineX(p1.c, p2.c, p2.r)) {
                return [p1, { r: p2.r, c: p1.c }, p2];
            }

            for (let c = 0; c < COLS + 2; c++) {
                if (c === p1.c) continue;
                if (checkLineX(p1.c, c, p1.r) && 
                    board[p1.r][c] === -1 && board[p2.r][c] === -1 &&
                    checkLineY(p1.r, p2.r, c) && 
                    checkLineX(c, p2.c, p2.r)) {
                    return [p1, { r: p1.r, c: c }, { r: p2.r, c: c }, p2];
                }
            }

            for (let r = 0; r < ROWS + 2; r++) {
                if (r === p1.r) continue;
                if (checkLineY(p1.r, r, p1.c) && 
                    board[r][p1.c] === -1 && board[r][p2.c] === -1 &&
                    checkLineX(p1.c, p2.c, r) && 
                    checkLineY(r, p2.r, p2.c)) {
                    return [p1, { r: r, c: p1.c }, { r: r, c: p2.c }, p2];
                }
            }

            return null;
        }

        function checkLineX(c1, c2, r) {
            const min = Math.min(c1, c2);
            const max = Math.max(c1, c2);
            for (let c = min + 1; c < max; c++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        function checkLineY(r1, r2, c) {
            const min = Math.min(r1, r2);
            const max = Math.max(r1, r2);
            for (let r = min + 1; r < max; r++) {
                if (board[r][c] !== -1) return false;
            }
            return true;
        }

        // --- VẼ ĐƯỜNG NỐI ---
        function drawPath(path) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ff4757';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            for (let i = 0; i < path.length; i++) {
                const x = path[i].c * (TILE_SIZE + GAP) + TILE_SIZE / 2;
                const y = path[i].r * (TILE_SIZE + GAP) + TILE_SIZE / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function clearPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- HỖ TRỢ TRỘN & GỢI Ý ---
        function findAvailablePair() {
            let activeTiles = [];
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) activeTiles.push({ r, c, val: board[r][c] });
                }
            }

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].val === activeTiles[j].val) {
                        if (findPath(activeTiles[i], activeTiles[j])) {
                            return [activeTiles[i], activeTiles[j]];
                        }
                    }
                }
            }
            return null;
        }

        function checkAndAutoShuffle() {
            let pair = findAvailablePair();
            if (!pair) {
                let remainingValues = [];
                for (let r = 1; r <= ROWS; r++) {
                    for (let c = 1; c <= COLS; c++) {
                        if (board[r][c] !== -1) remainingValues.push(board[r][c]);
                    }
                }

                if (remainingValues.length === 0) return;

                do {
                    remainingValues.sort(() => Math.random() - 0.5);
                    let idx = 0;
                    for (let r = 1; r <= ROWS; r++) {
                        for (let c = 1; c <= COLS; c++) {
                            if (board[r][c] !== -1) board[r][c] = remainingValues[idx++];
                        }
                    }
                } while (!findAvailablePair());

                renderBoard();
            }
        }

        function useHint() {
            if (selectedTile) {
                getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
                selectedTile = null;
            }

            const pair = findAvailablePair();
            if (pair) {
                const el1 = getTileEl(pair[0].r, pair[0].c);
                const el2 = getTileEl(pair[1].r, pair[1].c);

                el1.classList.add('hint');
                el2.classList.add('hint');

                setTimeout(() => {
                    el1.classList.remove('hint');
                    el2.classList.remove('hint');
                }, 1200);
            }
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert('Hết giờ! Bạn đã thua cuộc.');
                initGame();
            }
        }

        function checkWin() {
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) return false;
                }
            }
            clearInterval(timerId);
            alert(`Chúc mừng! Bạn đã chiến thắng với ${score} điểm!`);
            initGame();
            return true;
        }

        window.onload = initGame;
    </script>
</body>
</html>
